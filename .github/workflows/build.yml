name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Fast test job — runs on every push/PR, no native deps needed
  # -----------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # PySide6 on Linux needs a few system libs even in offscreen mode
      - name: Install Qt system libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  # -----------------------------------------------------------------------
  # Native app builds — runs after tests pass, on master + tags
  # -----------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon runner
            platform: macOS
            briefcase_platform: macos
            artifact_glob: "dist/*.dmg"

          - os: windows-latest
            platform: Windows
            briefcase_platform: windows
            artifact_glob: "dist\\*.msi"

    steps:
      - uses: actions/checkout@v4

      # macOS: install libvips so pyvips gets the native library it wraps
      - name: Install libvips (macOS)
        if: runner.os == 'macOS'
        run: brew install libvips

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Briefcase manages its own isolated app environments — install it
      # as a standalone tool rather than into the project venv.
      - name: Install Briefcase
        run: pip install briefcase

      # `briefcase create` downloads Python, creates the app skeleton and
      # installs the app's dependencies into it.
      - name: Create app bundle
        run: briefcase create ${{ matrix.briefcase_platform }}

      # `briefcase build` compiles/links the bundle into a runnable .app
      - name: Build app bundle
        run: briefcase build ${{ matrix.briefcase_platform }}

      # `briefcase package` produces the distributable (DMG / MSI).
      # --no-sign: skip code-signing in CI (no certificate available).
      # Add an Apple developer certificate secret + notarisation step here
      # when you're ready to ship signed builds.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: briefcase package macos --no-sign

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: briefcase package windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-bundle
          path: ${{ matrix.artifact_glob }}

  # -----------------------------------------------------------------------
  # Attach the built binaries to the "latest" pre-release on master
  # -----------------------------------------------------------------------
  release:
    name: Publish to latest release
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      # Create the "latest" release if it doesn't exist yet
      - name: Ensure latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest --repo "$GH_REPO" 2>/dev/null || \
            gh release create latest --repo "$GH_REPO" \
              --title "Development Build" \
              --notes "Automated build from the master branch." \
              --prerelease

      # Replace old assets and upload the new ones
      - name: Upload binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases/tags/latest" \
            | jq -r '.assets[].url' \
            | xargs -r -I{} gh api -X DELETE {} \
            || true
          find artifacts/ -name "*.dmg" -o -name "*.msi" \
            | xargs -I{} gh release upload latest {} \
                --repo "$GH_REPO" --clobber
